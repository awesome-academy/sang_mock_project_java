<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::section})}">
<head><title>Expense Management</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Expense Management</h1>
        <a th:href="@{/admin/expenses/create}" class="btn btn-primary btn-sm">
            <i class="fas fa-plus"></i> Create New
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-3 shadow-sm">
        <div class="card-body p-2">
            <form th:action="@{/admin/expenses}" method="get" class="row g-2" th:object="${filterRequest}">
                <div class="col-md-3">
                    <input type="text" th:field="*{keyword}" class="form-control form-control-sm" placeholder="Search title...">
                </div>
				<div class="col-md-2">
				    <select th:field="*{userId}" class="form-select form-select-sm">
				        <option value="">All Users</option>
				        <option th:each="u : ${users}" 
				                th:value="${u.id}" 
				                th:text="${u.name}"></option> 
	                </select>
				</div>
                <div class="col-md-2">
                    <select th:field="*{categoryId}" class="form-select form-select-sm">
                        <option value="">All Categories</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="date" th:field="*{startDate}" class="form-control form-control-sm">
                </div>
                <div class="col-md-2">
                    <input type="date" th:field="*{endDate}" class="form-control form-control-sm">
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-secondary btn-sm w-100" aria-label="Search"><i class="fas fa-search"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
            <tr>
                <th>Date</th>
                <th>Title</th>
                <th>User</th>
                <th>Category</th>
                <th class="text-end">Amount</th>
                <th style="width: 120px;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="exp : ${expenses.content}">
                <td th:text="${#temporals.format(exp.expenseDate, 'dd/MM/yyyy')}"></td>
                <td th:text="${exp.title}" class="fw-bold"></td>
                <td th:text="${exp.userName}"></td>
                <td><span class="badge bg-light text-dark border" th:text="${exp.categoryName}"></span></td>
                <td class="text-end fw-bold text-danger" 
                    th:text="${'-$' + #numbers.formatDecimal(exp.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                <td>
                    <a th:href="@{/admin/expenses/edit/{id}(id=${exp.id})}" class="btn btn-outline-primary btn-sm me-1">
                        <i class="fas fa-edit"></i>
                    </a>
                    <button type="button" 
                            class="btn btn-outline-danger btn-sm"
                            data-bs-toggle="modal" 
                            data-bs-target="#deleteModal"
                            th:data-id="${exp.id}"
                            onclick="prepareDelete(this.getAttribute('data-id'))">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            </tr>
            <tr th:if="${expenses.empty}">
                <td colspan="6" class="text-center py-4 text-muted">No expenses found.</td>
            </tr>
            </tbody>
        </table>
    </div>
    
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true" aria-labelledby="deleteModalTitle">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">Are you sure you want to delete this expense?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <form id="deleteForm" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function prepareDelete(id) {
            document.getElementById('deleteForm').action = '/admin/expenses/delete/' + id;
        }
    </script>
    
	<div class="mt-3" th:if="${expenses.totalPages > 1}">
	        <nav>
	            <ul class="pagination justify-content-center">
	                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
	                    <a class="page-link" th:href="@{/admin/expenses(
	                        page=${currentPage}, 
	                        keyword=${filterRequest.keyword}, 
	                        userId=${filterRequest.userId},
	                        categoryId=${filterRequest.categoryId},
	                        startDate=${filterRequest.startDate},
	                        endDate=${filterRequest.endDate}
	                    )}">Previous</a>
	                </li>

	                <li class="page-item" th:each="i : ${#numbers.sequence(0, expenses.totalPages - 1)}"
	                    th:classappend="${currentPage == i} ? 'active'">
	                    <a class="page-link" th:href="@{/admin/expenses(
	                        page=${i + 1}, 
	                        keyword=${filterRequest.keyword}, 
	                        userId=${filterRequest.userId},
	                        categoryId=${filterRequest.categoryId},
	                        startDate=${filterRequest.startDate},
	                        endDate=${filterRequest.endDate}
	                    )}" th:text="${i + 1}">1</a>
	                </li>

	                <li class="page-item" th:classappend="${currentPage == expenses.totalPages - 1} ? 'disabled'">
	                    <a class="page-link" th:href="@{/admin/expenses(
	                        page=${currentPage + 2}, 
	                        keyword=${filterRequest.keyword}, 
	                        userId=${filterRequest.userId},
	                        categoryId=${filterRequest.categoryId},
	                        startDate=${filterRequest.startDate},
	                        endDate=${filterRequest.endDate}
	                    )}">Next</a>
	                </li>
	            </ul>
	        </nav>
	    </div>
</section>
</body>
</html>
