<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::section})}">
<head><title>Global Categories</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Global Categories</h1>
        <a th:href="@{/admin/categories/create}" class="btn btn-primary btn-sm">
            <i class="fas fa-plus"></i> Create New
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/categories}" method="get" class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" name="keyword" class="form-control form-control-sm" 
                   placeholder="Search name..." th:value="${keyword}">
        </div>
        <div class="col-md-3">
            <select name="type" class="form-select form-select-sm" onchange="this.form.submit()">
                <option value="" th:selected="${type == null}">All Types</option>
				<option th:each="t : ${T(com.example.ems.constant.CategoryType).values()}"
					th:value="${t}" 
			        th:text="${t}" 
			        th:selected="${type != null and t == type}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-secondary btn-sm w-100">Filter</button>
        </div>
    </form>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
            <tr>
                <th>Icon</th>
                <th>Name</th>
                <th>Type</th>
                <th>Description</th>
                <th style="width: 150px;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categories.content}">
                <td class="text-center">
                    <i th:if="${cat.icon}" th:class="${cat.icon} + ' fa-lg text-secondary'"></i>
                </td>
                <td th:text="${cat.name}" class="fw-bold"></td>
                <td>
                    <span th:if="${cat.type.name() == 'INCOME'}" class="badge bg-success">INCOME</span>
                    <span th:if="${cat.type.name() == 'EXPENSE'}" class="badge bg-danger">EXPENSE</span>
                </td>
                <td th:text="${cat.description}" class="text-muted small"></td>
                <td>
                    <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" class="btn btn-outline-primary btn-sm me-1">
                        <i class="fas fa-edit"></i>
                    </a>
					<button type="button" 
				        class="btn btn-outline-danger btn-sm"
				        data-bs-toggle="modal" 
				        data-bs-target="#deleteModal"
				        th:data-id="${cat.id}"
				        onclick="prepareDelete(this.getAttribute('data-id'))">
						<i class="fas fa-trash-alt"></i>
					</button>
                </td>
            </tr>
            <tr th:if="${categories.empty}">
                <td colspan="5" class="text-center py-4 text-muted">No categories found.</td>
            </tr>
            </tbody>
        </table>
    </div>
    
    <div class="mt-3" th:if="${categories.totalPages > 1}">
        <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item" th:each="i : ${#numbers.sequence(0, categories.totalPages - 1)}"
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/admin/categories(page=${i}, keyword=${keyword}, type=${type})}"
                       th:text="${i + 1}">1</a>
                </li>
            </ul>
        </nav>
    </div>
	<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this category? <br>
                    <span class="text-danger small">This action cannot be undone.</span>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					<form id="deleteForm" method="post">
				        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				        <button type="submit" class="btn btn-danger">Delete</button>
				    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function prepareDelete(id) {
            const deleteUrl = '/admin/categories/delete/' + id;
            document.getElementById('deleteForm').action = deleteUrl;
        }
    </script>
</section>
</body>
</html>
