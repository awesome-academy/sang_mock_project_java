<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::section})}">
	<head><title>Budget Templates</title></head>
	<body>
		<section>
		    <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
		        <h1 class="h2">Budget Templates</h1>
		        <a th:href="@{/admin/templates/create}" class="btn btn-primary btn-sm">
		            <i class="fas fa-plus"></i> Create New
		        </a>
		    </div>
		
		    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
		    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
		
		    <form th:action="@{/admin/templates}" method="get" class="row g-2 mb-3">
		        <div class="col-md-6">
		            <input type="text" name="keyword" class="form-control form-control-sm" 
		                   placeholder="Search template name..." th:value="${keyword}">
		        </div>
		        <div class="col-md-2">
		            <button type="submit" class="btn btn-secondary btn-sm w-100">Search</button>
		        </div>
		    </form>
		
		    <div class="table-responsive bg-white shadow-sm rounded">
		        <table class="table table-hover align-middle mb-0">
		            <thead class="bg-light">
		            <tr>
		                <th>Name</th>
		                <th>Period (Month)</th>
		                <th>Default Amount</th>
		                <th>Default Categories</th>
		                <th style="width: 150px;">Actions</th>
		            </tr>
		            </thead>
		            <tbody>
		            <tr th:each="tpl : ${templates.content}">
		                <td th:text="${tpl.name}" class="fw-bold"></td>
		                <td><span class="badge bg-info text-dark" th:text="${tpl.period}">2024-01</span></td>
		                <td class="text-success fw-bold" th:text="${'$' + #numbers.formatDecimal(tpl.defaultAmount, 1, 'COMMA', 0, 'POINT')}">$500</td>
		                <td th:text="${#strings.abbreviate(tpl.defaultCategories, 50)}" class="text-muted small"></td>
		                <td>
		                    <a th:href="@{/admin/templates/edit/{id}(id=${tpl.id})}" class="btn btn-outline-primary btn-sm me-1">
		                        <i class="fas fa-edit"></i>
		                    </a>
		                    <button type="button" 
		                            class="btn btn-outline-danger btn-sm"
		                            data-bs-toggle="modal" 
		                            data-bs-target="#deleteModal"
		                            th:data-id="${tpl.id}"
		                            onclick="prepareDelete(this.getAttribute('data-id'))">
		                        <i class="fas fa-trash-alt"></i>
		                    </button>
		                </td>
		            </tr>
		            <tr th:if="${templates.empty}">
		                <td colspan="5" class="text-center py-4 text-muted">No templates found.</td>
		            </tr>
		            </tbody>
		        </table>
		    </div>
		
		    <div class="mt-3" th:if="${templates.totalPages > 1}">
		        <nav>
		            <ul class="pagination justify-content-center">
		                <li class="page-item" th:each="i : ${#numbers.sequence(0, templates.totalPages - 1)}"
		                    th:classappend="${currentPage == i} ? 'active'">
		                    <a class="page-link" th:href="@{/admin/templates(page=${i}, keyword=${keyword})}"
		                       th:text="${i + 1}">1</a>
		                </li>
		            </ul>
		        </nav>
		    </div>
		
		    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true" aria-labelledby="deleteModalTitle">
		        <div class="modal-dialog">
		            <div class="modal-content">
		                <div class="modal-header">
		                    <h5 class="modal-title">Confirm Deletion</h5>
		                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
		                </div>
		                <div class="modal-body">Are you sure you want to delete this template?</div>
		                <div class="modal-footer">
		                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
		                    <form id="deleteForm" method="post">
		                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		                        <button type="submit" class="btn btn-danger">Delete</button>
		                    </form>
		                </div>
		            </div>
		        </div>
		    </div>
		    
		    <script>
		        function prepareDelete(id) {
		            document.getElementById('deleteForm').action = '/admin/templates/delete/' + encodeURIComponent(id);
		        }
		    </script>
		</section>
	</body>
</html>
