<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::section})}">
<head>
    <title>Log Detail</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Log Detail</h1>
        <a th:href="@{/admin/logs}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left"></i> Back to List
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <span class="fw-bold text-secondary">
                <i class="fas fa-info-circle me-1"></i> Log ID: 
                <span class="font-monospace user-select-all" th:text="${log.id}"></span>
            </span>
            <span class="text-muted small" th:text="${#temporals.format(log.timestamp, 'dd/MM/yyyy HH:mm:ss')}"></span>
        </div>
        
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="small text-muted text-uppercase fw-bold">User</label>
                    <div class="fs-5">
                        <i class="fas fa-user-circle text-secondary me-1"></i>
                        <span th:text="${log.userName}"></span>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <label class="small text-muted text-uppercase fw-bold">Action</label>
                    <div>
                        <span th:if="${log.action == 'CREATE'}" class="badge bg-success fs-6">CREATE</span>
                        <span th:if="${log.action == 'UPDATE'}" class="badge bg-warning text-dark fs-6">UPDATE</span>
                        <span th:if="${log.action == 'DELETE'}" class="badge bg-danger fs-6">DELETE</span>
                        <span th:if="${log.action == 'LOGIN'}" class="badge bg-info text-dark fs-6">LOGIN</span>
                        <span th:if="${log.action == 'LOGOUT'}" class="badge bg-dark fs-6">LOGOUT</span>
                        <span th:unless="${#lists.contains({'CREATE','UPDATE','DELETE','LOGIN','LOGOUT'}, log.action)}" 
                              class="badge bg-secondary fs-6" th:text="${log.action}"></span>
                    </div>
                </div>
            </div>

            <hr class="text-muted opacity-25">

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="small text-muted text-uppercase fw-bold">Module / Entity Type</label>
                    <div>
                        <span class="badge bg-light text-dark border px-3 py-2" th:text="${log.entityType}"></span>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="small text-muted text-uppercase fw-bold">Target Entity ID</label>
                    <div class="input-group input-group-sm">
                        <input type="text" class="form-control font-monospace bg-white" th:value="${log.entityId}" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="copyToClipboard(this)">
                            <i class="far fa-copy"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="small text-muted text-uppercase fw-bold mb-1">Description / Changes</label>
                <div class="p-3 bg-light border rounded font-monospace small text-break" 
                     style="white-space: pre-wrap; min-height: 80px; border-left: 4px solid #6c757d !important;" 
                     th:text="${log.description}"></div>
            </div>

            <div class="d-flex justify-content-end mt-4">
                <button type="button" 
                        class="btn btn-danger" 
                        data-bs-toggle="modal" 
                        data-bs-target="#deleteDetailModal">
                    <i class="fas fa-trash-alt me-1"></i> Delete Log
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this log record permanently?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <form th:action="@{/admin/logs/delete/{id}(id=${log.id})}" method="post">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function copyToClipboard(btn) {
            const input = btn.previousElementSibling;
            input.select();
            navigator.clipboard.writeText(input.value);
            
            // Visual feedback
            const originalIcon = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i>';
            btn.classList.replace('btn-outline-secondary', 'btn-success');
            setTimeout(() => {
                btn.innerHTML = originalIcon;
                btn.classList.replace('btn-success', 'btn-outline-secondary');
            }, 1000);
        }
    </script>
</section>
</body>
</html>
