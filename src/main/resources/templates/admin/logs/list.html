<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::section})}">
<head><title>System Logs</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Activity Logs</h1>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-3 shadow-sm">
        <div class="card-body p-2">
            <form th:action="@{/admin/logs}" method="get" class="row g-2" th:object="${filterRequest}">
                <div class="col-md-3">
                    <input type="text" th:field="*{keyword}" class="form-control form-control-sm" placeholder="Search description...">
                </div>
                
                <div class="col-md-2">
                    <select th:field="*{userId}" class="form-select form-select-sm">
                        <option value="">All Users</option>
                        <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.name}"></option> 
                    </select>
                </div>

                <div class="col-md-2">
                    <select th:field="*{action}" class="form-select form-select-sm">
                        <option value="">All Actions</option>
                        <option th:each="act : ${actions}" th:value="${act}" th:text="${act}"></option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select th:field="*{entityType}" class="form-select form-select-sm">
                        <option value="">All Modules</option>
                        <option th:each="type : ${entityTypes}" th:value="${type}" th:text="${type}"></option>
                    </select>
                </div>

                <div class="col-md-3">
                    <div class="input-group input-group-sm">
                        <input type="date" th:field="*{startDate}" class="form-control" placeholder="Start">
                        <span class="input-group-text">-</span>
                        <input type="date" th:field="*{endDate}" class="form-control" placeholder="End">
                        <button type="submit" class="btn btn-secondary" aria-label="Search">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
            <tr>
                <th style="width: 15%">Time</th>
                <th style="width: 15%">User</th>
                <th style="width: 10%">Action</th>
                <th style="width: 10%">Module</th>
                <th>Description</th>
                <th style="width: 100px;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="log : ${logs.content}">
                <td th:text="${#temporals.format(log.timestamp, 'dd/MM/yyyy HH:mm:ss')}" class="small text-muted"></td>
                
                <td th:text="${log.userName}" class="fw-bold"></td>
                
                <td>
                    <span th:if="${log.action == 'CREATE'}" class="badge bg-success">CREATE</span>
                    <span th:if="${log.action == 'UPDATE'}" class="badge bg-warning text-dark">UPDATE</span>
                    <span th:if="${log.action == 'DELETE'}" class="badge bg-danger">DELETE</span>
                    <span th:if="${log.action == 'LOGIN'}" class="badge bg-info text-dark">LOGIN</span>
                    <span th:if="${log.action == 'LOGOUT'}" class="badge bg-dark">LOGOUT</span>
                    <span th:unless="${#lists.contains({'CREATE','UPDATE','DELETE','LOGIN','LOGOUT'}, log.action)}" 
                          class="badge bg-secondary" th:text="${log.action}"></span>
                </td>

                <td><span class="badge bg-light text-dark border" th:text="${log.entityType}"></span></td>
                
                <td th:text="${log.description}" class="text-break small"></td>

                <td>
                    <a th:href="@{/admin/logs/{id}(id=${log.id})}" class="btn btn-outline-info btn-sm me-1" title="View Detail">
                        <i class="fas fa-eye"></i>
                    </a>
                    <button type="button" 
                            class="btn btn-outline-danger btn-sm"
                            data-bs-toggle="modal" 
                            data-bs-target="#deleteModal"
                            th:data-id="${log.id}"
                            onclick="prepareDelete(this.getAttribute('data-id'))" title="Delete">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            </tr>
            <tr th:if="${logs.empty}">
                <td colspan="6" class="text-center py-4 text-muted">No logs found matching your criteria.</td>
            </tr>
            </tbody>
        </table>
    </div>
    
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this log record? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <form id="deleteForm" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function prepareDelete(id) {
            document.getElementById('deleteForm').action = '/admin/logs/delete/' + id;
        }
    </script>
    
    <div class="mt-3" th:if="${logs.totalPages > 1}">
        <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/logs(
                        page=${currentPage}, 
                        keyword=${filterRequest.keyword}, 
                        userId=${filterRequest.userId},
                        action=${filterRequest.action},
                        entityType=${filterRequest.entityType},
                        startDate=${filterRequest.startDate},
                        endDate=${filterRequest.endDate}
                    )}">Previous</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}"
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/admin/logs(
                        page=${i + 1}, 
                        keyword=${filterRequest.keyword}, 
                        userId=${filterRequest.userId},
                        action=${filterRequest.action},
                        entityType=${filterRequest.entityType},
                        startDate=${filterRequest.startDate},
                        endDate=${filterRequest.endDate}
                    )}" th:text="${i + 1}">1</a>
                </li>

                <li class="page-item" th:classappend="${currentPage == logs.totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/logs(
                        page=${currentPage + 2}, 
                        keyword=${filterRequest.keyword}, 
                        userId=${filterRequest.userId},
                        action=${filterRequest.action},
                        entityType=${filterRequest.entityType},
                        startDate=${filterRequest.startDate},
                        endDate=${filterRequest.endDate}
                    )}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</section>
</body>
</html>
